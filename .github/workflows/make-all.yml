name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Verify make all
        run: make all

      - name: Report uncovered source lines on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re
          for page in sorted(Path("cover").glob("*.html")):
              for row in re.findall(r'<tr class="miss">(.*?)</tr>', page.read_text(), re.S):
                  text = " ".join(html.unescape(re.sub(r'<[^>]+>', ' ', row)).split())
                  print(f"{page.name}: {text}")
          PY
